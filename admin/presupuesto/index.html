<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoilTech — Presupuesto</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#F4F0E8;--sf:#fff;--sf2:#EDE9E0;--g:#34A678;--gd:#18403E;--gl:rgba(52,166,120,0.08);--tx:#1A1A1A;--tx2:#6B6B6B;--tx3:#9CA3AF;--bd:#E0DDD5;--dg:#EF4444;--warn:#F59E0B;--info:#3B82F6;--r:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--gd);color:var(--tx);height:100vh;overflow:hidden}
.app{display:grid;grid-template-columns:1fr 400px;grid-template-rows:48px 1fr;height:100vh}
.tb{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--gd);border-bottom:1px solid rgba(255,255,255,0.08)}
.tb h1{font-size:15px;color:#fff}.tb a{color:rgba(255,255,255,0.4);text-decoration:none;font-size:11px;margin-left:12px}.tb a:hover{color:#fff}
.tb-r{display:flex;gap:6px}
.btn{padding:7px 14px;border-radius:6px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;border:none;transition:all .15s}
.btn-g{background:var(--g);color:#fff}.btn-g:hover{background:#2D9068}
.btn-w{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.12)}.btn-w:hover{background:rgba(255,255,255,0.15)}
.btn-warn{background:var(--warn);color:#fff}.btn-info{background:var(--info);color:#fff}.btn-dg{background:var(--dg);color:#fff}
.fp{overflow-y:auto;background:var(--bg);padding:20px 24px 80px;scrollbar-width:thin;display:none;height:100%}.fp.active{display:block}
.rp{overflow-y:auto;background:var(--gd);padding:16px;border-left:1px solid rgba(255,255,255,0.08);scrollbar-width:thin}
/* Cards dashboard */
.dash-stats{display:flex;gap:10px;margin-bottom:14px}
.ds{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;flex:1;text-align:center}
.ds .v{font-size:18px;font-weight:700;color:var(--gd)}.ds .l{font-size:9px;color:var(--tx2);text-transform:uppercase}
.dash-filters{display:flex;gap:6px;margin-bottom:12px;align-items:center}
.dash-filters input{flex:1;padding:7px 10px;border:1px solid var(--bd);border-radius:6px;font-family:inherit;font-size:12px;background:var(--sf)}
.pill{padding:5px 12px;border-radius:16px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx2)}.pill.active{background:var(--gd);color:#fff;border-color:var(--gd)}
.cot-card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:8px;cursor:pointer;transition:all .15s;position:relative}
.cot-card:hover{border-color:var(--g);box-shadow:0 2px 12px rgba(52,166,120,0.1)}
.cot-card.selected{border-color:var(--g);box-shadow:0 0 0 2px var(--gl)}
.cot-card h3{font-size:14px;font-weight:700;color:var(--gd);margin-bottom:2px}
.cot-card .meta{font-size:11px;color:var(--tx2)}
.cot-card .amount{position:absolute;top:14px;right:14px;font-size:16px;font-weight:700;color:var(--gd)}
.cot-card .badges{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px}
.badge-cot{background:rgba(245,158,11,0.12);color:#B45309}.badge-act{background:rgba(52,166,120,0.1);color:var(--g)}.badge-fin{background:rgba(107,107,107,0.1);color:var(--tx2)}
.cot-actions{display:flex;gap:4px;margin-top:6px}
.cot-actions .btn{padding:3px 8px;font-size:10px}
/* Form */
.sc{font-size:10px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:1.2px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}.sc::after{content:'';flex:1;height:1px;background:var(--bd)}.sc:first-child{margin-top:0}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.cd-t{font-size:11px;font-weight:700;color:var(--gd);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.cd-t .pct{font-size:9px;color:var(--tx3);font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}.g5{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:8px}
.f{margin-bottom:6px}.f label{display:block;font-size:9px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px;margin-bottom:1px}
.f input,.f select{width:100%;padding:6px 9px;border:1px solid var(--bd);border-radius:5px;font-family:inherit;font-size:12px;background:var(--bg)}
.f input:focus,.f select:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 2px var(--gl)}
.f input[readonly]{background:var(--sf2);font-weight:600;color:var(--gd)}
.f-hint{font-size:8px;color:var(--tx3);margin-top:1px}
.ht{width:100%;border-collapse:collapse;font-size:11px}.ht th{font-size:9px;font-weight:600;color:var(--tx3);padding:3px 4px;border-bottom:1px solid var(--bd);text-transform:uppercase;text-align:left}.ht td{padding:2px 3px}.ht input,.ht select{padding:4px 6px;font-size:11px}
.ht .sub-row td{background:var(--sf2);font-weight:700;font-size:10px;color:var(--gd)}
.ab{background:none;border:1px dashed var(--g);color:var(--g);padding:3px 8px;border-radius:4px;cursor:pointer;font-size:10px;font-weight:600;margin-top:4px}.ab:hover{background:var(--gl)}
.rm{background:none;border:none;color:var(--dg);cursor:pointer;font-size:14px}
.aux-box{background:var(--sf2);border-radius:6px;padding:8px 10px;margin-top:6px;font-size:10px;color:var(--tx2)}
.aux-box .aux-row{display:flex;justify-content:space-between;padding:1px 0}
.aux-box .aux-row strong{color:var(--gd)}
/* Results panel */
.rr{display:flex;justify-content:space-between;padding:4px 0;font-size:11px;color:rgba(255,255,255,0.65)}.rr .rv{font-weight:600;color:#fff;text-align:right}
.rr.sub{font-weight:700;color:rgba(255,255,255,0.9);border-bottom:1px solid rgba(255,255,255,0.06);padding-bottom:6px;margin-bottom:2px}.rr.sub .rv{color:var(--g)}
.rr.total{border-top:2px solid var(--g);margin-top:6px;padding-top:8px;font-size:15px;color:#fff;font-weight:700}.rr.total .rv{color:var(--g);font-size:17px}
.rr.sol{border:2px solid var(--g);border-radius:6px;padding:8px;margin-top:6px;font-size:14px;color:#fff;font-weight:700;background:rgba(52,166,120,0.1)}.rr.sol .rv{color:var(--g);font-size:18px}
.rs{font-size:9px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:1px;margin-top:12px;margin-bottom:1px}
.rdiv{height:1px;background:rgba(255,255,255,0.05);margin:6px 0}
.rp-empty{color:rgba(255,255,255,0.3);font-size:12px;text-align:center;padding:40px 20px}
.margin-box{background:rgba(52,166,120,0.08);border:1px solid rgba(52,166,120,0.2);border-radius:6px;padding:8px 10px;margin-top:8px}
.margin-box .rr{color:rgba(255,255,255,0.7);font-size:10px;padding:2px 0}
.margin-box .rr .rv{font-size:10px}
.flow-box{margin-top:8px}
.flow-box .flow-col{display:inline-block;width:48%;vertical-align:top;padding:4px}
.flow-box .flow-h{font-size:8px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:28px;position:relative}
.modal h3{font-size:16px;font-weight:700;color:var(--gd);margin-bottom:16px}.modal .close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--tx3)}
.sec{font-size:10px;font-weight:700;color:var(--g);text-transform:uppercase;margin:12px 0 6px}
.prop-modal{max-width:820px;padding:40px}.prop-modal h3{font-size:14px;text-transform:uppercase;margin:16px 0 6px}
.prop-modal table{width:100%;border-collapse:collapse;margin:8px 0}.prop-modal th,.prop-modal td{padding:6px 10px;border:1px solid var(--bd);font-size:12px;text-align:left}.prop-modal th{background:var(--gd);color:#fff}
/* ═══ Detail Dashboard ═══ */
.det-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:16px 20px;background:var(--gd);border-radius:12px;color:#fff}
.det-header h2{font-size:18px;font-weight:700;margin:0}.det-header .det-sub{font-size:11px;color:rgba(255,255,255,0.6);margin-top:2px}
.det-header .det-badge{padding:4px 12px;border-radius:12px;font-size:10px;font-weight:700}
.det-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.det-kpi{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 12px;text-align:center;position:relative;overflow:hidden}
.det-kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.det-kpi.kpi-g::before{background:var(--g)}.det-kpi.kpi-b::before{background:var(--info)}.det-kpi.kpi-w::before{background:var(--warn)}.det-kpi.kpi-d::before{background:var(--gd)}
.det-kpi .kv{font-size:20px;font-weight:700;color:var(--gd)}.det-kpi .kl{font-size:9px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.det-card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px 18px}
.det-card h4{font-size:12px;font-weight:700;color:var(--gd);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.det-card.full{grid-column:1/-1}
/* Donut */
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut-legend{flex:1}
.donut-legend-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--sf2)}
.donut-legend-item:last-child{border:none}
.donut-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.donut-legend-item .dl-name{flex:1;font-size:12px;color:var(--tx)}
.donut-legend-item .dl-val{font-size:12px;font-weight:700;color:var(--gd)}
.donut-legend-item .dl-pct{font-size:10px;font-weight:600;margin-left:6px;padding:2px 6px;border-radius:8px;background:var(--sf2)}
/* Bars */
.bar-wrap{margin-bottom:8px}
.bar-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.bar-label span:first-child{color:var(--tx2)}.bar-label span:last-child{font-weight:700;color:var(--gd)}
.bar-track{height:8px;background:var(--sf2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
/* Metrics grid */
.met-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.met-item{background:var(--sf2);border-radius:8px;padding:10px 12px;text-align:center}
.met-item .mv{font-size:15px;font-weight:700;color:var(--gd)}.met-item .ml{font-size:8px;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
/* Flow columns */
.flow-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flow-card{background:var(--sf2);border-radius:8px;padding:12px}
.flow-card h5{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.flow-card.t1 h5{color:var(--g)}.flow-card.t2 h5{color:var(--info)}
.flow-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:var(--tx2)}
.flow-row strong{color:var(--gd)}
.flow-row.neg strong{color:var(--dg)}
.flow-row.pos strong{color:var(--g)}
/* Propuesta preview */
.prop-preview{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.prop-item{text-align:center;padding:12px;background:var(--sf2);border-radius:8px}
.prop-item .pi-label{font-size:9px;color:var(--tx2);text-transform:uppercase;margin-bottom:4px}
.prop-item .pi-val{font-size:16px;font-weight:700;color:var(--gd)}
.prop-total{text-align:center;padding:14px;background:var(--gd);border-radius:8px;color:#fff}
.prop-total .pi-label{font-size:9px;color:rgba(255,255,255,0.6);text-transform:uppercase;margin-bottom:4px}
.prop-total .pi-val{font-size:22px;font-weight:700;color:var(--g)}
/* Subtotal bars */
.sub-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;margin-top:6px;background:var(--gd);border-radius:6px;color:#fff;font-size:11px}
.sub-bar .sb-label{font-weight:700;text-transform:uppercase;letter-spacing:.3px;font-size:10px}
.sub-bar .sb-vals{display:flex;gap:14px;align-items:center}
.sub-bar .sb-gs{font-weight:600}.sub-bar .sb-usd{color:var(--g);font-weight:700}.sub-bar .sb-pct{background:rgba(255,255,255,0.15);padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700}
/* Pesos section */
.peso-card{background:linear-gradient(135deg,#1a3a2a 0%,var(--gd) 100%);border:2px solid var(--g);border-radius:12px;padding:18px 20px;margin-bottom:10px}
.peso-card .cd-t{color:#fff;font-size:13px;margin-bottom:12px}
.peso-row{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:6px;border-radius:8px;background:rgba(255,255,255,0.06)}
.peso-row label.chk{display:flex;align-items:center;gap:6px;cursor:pointer;color:rgba(255,255,255,0.9);font-size:12px;font-weight:600;min-width:120px}
.peso-row label.chk input[type=checkbox]{accent-color:var(--g);width:16px;height:16px}
.peso-row .peso-input{width:70px;padding:6px 8px;border:1px solid rgba(255,255,255,0.2);border-radius:5px;background:rgba(255,255,255,0.1);color:#fff;font-size:13px;font-weight:700;text-align:center;font-family:inherit}
.peso-row .peso-input:focus{border-color:var(--g);outline:none}
.peso-row .peso-result{flex:1;text-align:right;font-size:12px;color:rgba(255,255,255,0.6)}
.peso-row .peso-result strong{color:var(--g);font-size:13px}
.peso-total{display:flex;justify-content:space-between;padding:10px 14px;margin-top:4px;border-top:2px solid var(--g);color:#fff;font-weight:700;font-size:13px}
.peso-total .pt-val{color:var(--g);font-size:15px}
/* CTA button */
.det-cta{display:flex;gap:8px;margin-top:16px}
.det-cta .btn{padding:12px 24px;font-size:13px;flex:1;text-align:center;border-radius:8px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 20px;border-radius:6px;font-size:12px;font-weight:600;opacity:0;transition:opacity .3s;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,0.3)}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="tb">
    <div style="display:flex;align-items:center">
      <h1>SoilTech — Presupuestos</h1><a href="../">← Admin</a><a href="../facturacion/">Facturación →</a>
    </div>
    <div class="tb-r" id="tbActions">
      <button class="btn btn-g" onclick="newPresupuesto()">+ Nuevo Presupuesto</button>
    </div>
  </div>
  <!-- LEFT: Dashboard (default) or Form -->
  <div style="overflow:hidden">
    <div class="fp active" id="panelDash">
      <div class="dash-stats" id="dashStats"></div>
      <div class="dash-filters">
        <input id="searchCot" placeholder="Buscar cliente, proyecto..." oninput="renderDash()">
        <span class="pill active" onclick="setFilter('all',this)">Todos</span>
        <span class="pill" onclick="setFilter('Cotización',this)">Cotizaciones</span>
        <span class="pill" onclick="setFilter('En Curso',this)">En Curso</span>
        <span class="pill" onclick="setFilter('Finalizado',this)">Finalizados</span>
      </div>
      <div id="cotCards"></div>
    </div>
    <div class="fp" id="panelDetail">
      <div id="detailContent"></div>
    </div>
    <div class="fp" id="panelForm">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <button class="btn btn-w" style="color:var(--tx);background:var(--sf);border:1px solid var(--bd)" onclick="editingId?backToDetail():backToDash()">← Volver</button>
        <div style="display:flex;gap:6px">
          <button class="btn btn-w" style="color:var(--tx);background:var(--sf);border:1px solid var(--bd)" onclick="showProp()">📄 Propuesta</button>
          <button class="btn btn-w" style="color:var(--tx);background:var(--sf);border:1px solid var(--bd)" onclick="exportXlsx()">📥 Excel</button>
          <button class="btn btn-g" onclick="guardar()">💾 Guardar</button>
        </div>
      </div>
      <div id="formContent"></div>
    </div>
  </div>
  <!-- RIGHT: Summary panel -->
  <div class="rp">
    <div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:12px" id="rpTitle">Resumen</div>
    <div id="rc"><div class="rp-empty">Seleccioná una cotización o creá una nueva</div></div>
  </div>
</div>

<!-- Approve modal -->
<div class="modal-bg" id="approveModal"><div class="modal" style="max-width:560px"><button class="close" onclick="hideModal('approveModal')">×</button>
  <h3>✅ Aprobar Proyecto</h3>
  <p style="font-size:11px;color:var(--tx2);margin-bottom:14px;padding:8px;background:var(--gl);border-radius:6px" id="appSummary"></p>
  <div class="sec">Datos del proyecto</div>
  <div class="f"><label>Nombre</label><input id="apNombre"></div>
  <div class="f"><label>Cliente</label><input id="apCliente" readonly style="background:var(--sf2)"></div>
  <div class="g2"><div class="f"><label>Valor USD</label><input id="apValor" type="number" oninput="updateApPreview()"></div><div class="f"><label>% IVA</label><input id="apIva" type="number" value="7" oninput="updateApPreview()"></div></div>
  <div class="f"><label>Fecha inicio</label><input id="apFecha" type="date"></div>
  <div style="padding:8px;background:var(--sf2);border-radius:6px;margin:6px 0;font-size:11px" id="apIvaPreview"></div>
  <div class="sec">Factura anticipo</div>
  <div class="g3"><div class="f"><label>% Anticipo</label><input id="apPct" type="number" value="60" oninput="updateApPreview()"></div><div class="f"><label>Monto</label><input id="apMonto" readonly style="font-weight:700;color:var(--gd)"></div><div class="f"><label>Moneda</label><select id="apMoneda"><option>DOLARES AMERICANOS</option><option>GUARANIES</option></select></div></div>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-g" style="flex:1;padding:10px" onclick="confirmApprove()">✅ Confirmar</button><button class="btn btn-w" style="color:var(--tx);background:var(--sf);border:1px solid var(--bd)" onclick="hideModal('approveModal')">Cancelar</button></div>
</div></div>

<!-- Post-approve -->
<div class="modal-bg" id="postApproveModal"><div class="modal" style="max-width:380px;text-align:center">
  <h3>✅ Proyecto activado</h3>
  <p style="font-size:12px;color:var(--tx2);margin-bottom:16px" id="postApproveMsg"></p>
  <div style="display:flex;gap:8px"><button class="btn btn-info" style="flex:1;padding:10px" onclick="goToFacturacion()">🧾 Ir a Facturación</button><button class="btn btn-w" style="flex:1;color:var(--tx);background:var(--sf);border:1px solid var(--bd)" onclick="hideModal('postApproveModal');loadAll()">Quedarme aquí</button></div>
</div></div>

<!-- New client modal -->
<div class="modal-bg" id="newCliModal"><div class="modal" style="max-width:440px"><button class="close" onclick="hideModal('newCliModal')">×</button>
  <h3>Nuevo Cliente</h3>
  <div class="f"><label>Razón Social / Nombre</label><input id="ncNombre"></div>
  <div class="f"><label>RUC / CI</label><input id="ncRuc"></div>
  <div class="g2"><div class="f"><label>Departamento</label><select id="ncDepto"><option value="">— Seleccionar —</option><option>Alto Paraguay</option><option>Alto Paraná</option><option>Amambay</option><option>Boquerón</option><option>Caaguazú</option><option>Caazapá</option><option>Canindeyú</option><option>Central</option><option>Concepción</option><option>Cordillera</option><option>Guairá</option><option>Itapúa</option><option>Misiones</option><option>Ñeembucú</option><option>Paraguarí</option><option>Presidente Hayes</option><option>San Pedro</option></select></div><div class="f"><label>Localidad</label><input id="ncLocal"></div></div>
  <div class="f"><label>Teléfono</label><input id="ncTel"></div>
  <div class="f"><label>Persona de Contacto</label><input id="ncContacto"></div>
  <div class="f"><label>Dirección</label><input id="ncDir"></div>

/* SVG donut builder */
function buildDonut(data,total){
  if(total<=0)return '<svg width="120" height="120"><circle cx="60" cy="60" r="50" fill="none" stroke="#E0DDD5" stroke-width="14"/></svg>';
  var svg='<svg width="130" height="130" viewBox="0 0 130 130">';
  var cx=65,cy=65,r=50,circ=2*Math.PI*r,offset=0;
  data.forEach(function(d){
    var pct=d.val/total;
    var dash=pct*circ;
    var gap=circ-dash;
    svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="16" stroke-dasharray="'+dash+' '+gap+'" stroke-dashoffset="'+(-(offset))+'" transform="rotate(-90 '+cx+' '+cy+')" style="transition:stroke-dasharray .6s ease"/>';
    offset+=dash;
  });
  /* Center text */
  svg+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#18403E">'+data.length+'</text>';
  svg+='<text x="'+cx+'" y="'+(cy+10)+'" text-anchor="middle" font-size="8" fill="#9CA3AF">rubros</text>';
  svg+='</svg>';
  return svg;
}

/* Panel navigation */
function showPanel(id){
  ['panelDash','panelDetail','panelForm'].forEach(function(p){document.getElementById(p).classList.remove('active')});
  document.getElementById(id).classList.add('active');
}
function backToDash(){
  showPanel('panelDash');
  loadAll();
}
function backToDetail(){
  showPanel('panelDetail');
}

/* ═══════════════════════════════════════ */
/*  CALC — Espejo fiel del TEMPLATE XLSX  */
/* ═══════════════════════════════════════ */
function calc(){
  var V=function(id){var el=document.getElementById(id);return el?parseFloat(el.value)||0:0};
  var cot=V('cotizacion');if(cot===0)cot=6500;

  /* — Muestreo — */
  var cal=V('calicatas'),mpc=V('mpc'),bar=V('barrenadas'),mpb=V('mpb'),sup=V('superficie');
  var tmCal=cal*mpc, tmBar=bar*mpb, tm=tmCal+tmBar;
  var setV=function(id,v){var el=document.getElementById(id);if(el)el.value=v};
  setV('tmCal',tmCal); setV('tmBar',tmBar); setV('totalM',tm);
  setV('densidad',cal>0?(sup/cal).toFixed(1):'—');
  setV('supRef',sup);
  setV('pSaldo',(100-V('pAnt')));

  /* — Movilidad (cálculos auxiliares como en SUPUESTOS del Excel) — */
  var nVeh=V('nVehiculos'),diasCampo=V('diasCampo'),diasTotal=V('diasTotal'),distKm=V('distKm'),nViajes=V('nViajes');
  var consumoL=V('consumo'),pComb=V('pComb'),cAlq=V('cAlq'),pers=V('personas');
  var litrosViaje=distKm*consumoL/100;
  var litrosReserva=litrosViaje*1.2;
  var costoCombTotal=litrosReserva*pComb*nViajes*nVeh;
  var costoAlqTotal=cAlq*diasTotal*nVeh;
  var costoViaticos=V('cCons')*pers*diasTotal;
  var costoHospedaje=V('cHosp')*pers*diasTotal;

  var auxMov=document.getElementById('auxMovilidad');
  if(auxMov)auxMov.innerHTML=
    '<div class="aux-row"><span>Litros/viaje (1 veh.)</span><strong>'+litrosViaje.toFixed(0)+' L</strong></div>'+
    '<div class="aux-row"><span>Litros con 20% reserva</span><strong>'+litrosReserva.toFixed(1)+' L</strong></div>'+
    '<div class="aux-row"><span>Costo combustible total</span><strong>₲ '+fmtGs(costoCombTotal)+'</strong></div>'+
    '<div class="aux-row"><span>Costo alquiler total ('+nVeh+' veh × '+diasTotal+' días)</span><strong>₲ '+fmtGs(costoAlqTotal)+'</strong></div>'+
    '<div class="aux-row"><span>Costo viáticos total</span><strong>₲ '+fmtGs(costoViaticos)+'</strong></div>'+
    '<div class="aux-row"><span>Costo hospedaje total</span><strong>₲ '+fmtGs(costoHospedaje)+'</strong></div>';

  /* — Honorarios — */
  /* Tabla: td(num) td(sel-cat) td(inp0-nombre) td(inp1-cant) td(sel-unidad) td(inp2-dias) td(inp3-costoUnit) td(inp4-subtotal) td(btn) */
  var hon=0;
  Array.from(document.querySelectorAll('#honBody tr')).forEach(function(r){
    var inp=r.querySelectorAll('input');
    var sels=r.querySelectorAll('select');
    var cantidad=parseFloat(inp[1]&&inp[1].value)||0;
    var unidad=(sels[1]&&sels[1].value)||'Honorario fijo';
    var dias=parseFloat(inp[2]&&inp[2].value)||0;
    var costoUnit=parseFloat(inp[3]&&inp[3].value)||0;
    var sub=0;
    if(unidad==='Por calicata'){sub=cantidad*costoUnit*cal;}
    else if(unidad==='Por día'){sub=cantidad*costoUnit*dias;}
    else{sub=cantidad*costoUnit*dias;}
    if(inp[4])inp[4].value=fmtGs(sub);
    hon+=sub;
  });

  /* — Equipos (depreciación: costo_mes × cant × días) — */
  var equipTotal=0;
  Array.from(document.querySelectorAll('#equipBody tr')).forEach(function(r){
    var inp=r.querySelectorAll('input');
    var cant=parseFloat(inp[0]&&inp[0].value)||0;
    var dias_e=parseFloat(inp[1]&&inp[1].value)||0;
    var eqId=r.dataset.equip;
    var eq=EQUIPOS.find(function(e){return e.id===eqId});
    var costoMes=eq?eq.costoMes:0;
    var sub=cant*costoMes*dias_e;
    var roInputs=r.querySelectorAll('input[readonly]');
    if(roInputs[0])roInputs[0].value=fmtGs(sub);
    equipTotal+=sub;
  });

  /* — Otros gastos — */
  var otrosTotal=0;
  Array.from(document.querySelectorAll('#otrosBody tr')).forEach(function(r){
    var inp=r.querySelectorAll('input');
    var cant=parseFloat(inp[1]&&inp[1].value)||0;
    var dias_o=parseFloat(inp[2]&&inp[2].value)||0;
    var costoU=parseFloat(inp[3]&&inp[3].value)||0;
    var sub=cant*costoU*dias_o;
    if(inp[4])inp[4].value=fmtGs(sub);
    otrosTotal+=sub;
  });

  /* — Peaje — */
  var peaje=getPeajeTotal();

  /* — TOTAL PREPARACIÓN — */
  var sPrep=hon+costoAlqTotal+costoCombTotal+costoViaticos+costoHospedaje+equipTotal+otrosTotal+peaje;

  /* — Laboratorio — */
  // Auto-set quantities based on analysis type
  LAB_PRES.forEach(function(a){
    var el=document.getElementById('labQty_'+a.id);
    if(el){
      if(a.appliesTo==='calicatas')el.value=tmCal;
      else if(a.appliesTo==='barrenadas')el.value=tmBar;
      else el.value=tm;
    }
  });
  var sLab=0;
  Array.from(document.querySelectorAll('#labBody tr')).forEach(function(r){
    var inp=r.querySelectorAll('input');
    var qty=parseFloat(inp[0]&&inp[0].value)||0;
    var price=parseFloat(inp[1]&&inp[1].value)||0;
    var total=qty*price;
    var roInputs=r.querySelectorAll('input[readonly]');
    if(roInputs[0])roInputs[0].value=fmtGs(total);
    if(roInputs[1])roInputs[1].value=cot>0?fmtUsd(total/cot):'—';
    sLab+=total;
  });
  var labH=document.getElementById('labHeader');
  if(labH)labH.textContent='Calicatas: '+cal+' × '+mpc+' = '+tmCal+' | Barrenadas: '+bar+' × '+mpb+' = '+tmBar+' | Total: '+tm;

  /* — Informe — */
  var sInf=0;
  Array.from(document.querySelectorAll('#infBody tr')).forEach(function(r){
    var inp=r.querySelectorAll('input');
    var cant=parseFloat(inp[1]&&inp[1].value)||0;
    var costoU=parseFloat(inp[2]&&inp[2].value)||0;
    var total=cant*costoU;
    var roInputs=r.querySelectorAll('input[readonly]');
    if(roInputs[0])roInputs[0].value=fmtGs(total);
    if(roInputs[1])roInputs[1].value=cot>0?fmtUsd(total/cot):'—';
    sInf+=total;
  });

  /* — CONSOLIDACIÓN — */
  var subDirecto=sPrep+sLab+sInf;
  var movilidad=costoAlqTotal+costoCombTotal+costoViaticos+costoHospedaje;

  /* Subtotal bars helper */
  var setSub=function(prefix,gs,total){
    var el1=document.getElementById(prefix+'Gs'),el2=document.getElementById(prefix+'Usd'),el3=document.getElementById(prefix+'Pct');
    if(el1)el1.textContent='₲ '+fmtGs(gs);
    if(el2)el2.textContent='USD '+fmtUsd(cot>0?gs/cot:0);
    if(el3)el3.textContent=total>0?Math.round(gs/total*100)+'%':'—';
  };
  setSub('subHon',hon,subDirecto);
  setSub('subMov',movilidad,subDirecto);
  setSub('subEquip',equipTotal,subDirecto);
  setSub('subOtros',otrosTotal,subDirecto);
  setSub('subPeaje',peaje,subDirecto);
  setSub('subPrep',sPrep,subDirecto);
  setSub('subLab',sLab,subDirecto);
  setSub('subInf',sInf,subDirecto);

  /* Auto-calcular pesos proporcionales */
  if(subDirecto>0){
    var autoPrep=Math.round(sPrep/subDirecto*100);
    var autoLab=Math.round(sLab/subDirecto*100);
    var autoInf=100-autoPrep-autoLab;
    var ppEl=document.getElementById('pesoPrep'),plEl=document.getElementById('pesoLab'),piEl=document.getElementById('pesoInf');
    if(ppEl&&!ppEl.dataset.manual){ppEl.value=autoPrep;}
    if(plEl&&!plEl.dataset.manual){plEl.value=autoLab;}
    if(piEl&&!piEl.dataset.manual){piEl.value=autoInf;}
  }

  /* Imprevisto ponderado por riesgo con checkboxes */
  var pImp=V('pImp')/100;
  var wPrep=V('pesoPrep')/100, wLab=V('pesoLab')/100, wInf=V('pesoInf')/100;
  var totalPeso=wPrep+wLab+wInf;if(totalPeso===0)totalPeso=1;
  var impPrep=subDirecto*pImp*(wPrep/totalPeso);
  var impLab=subDirecto*pImp*(wLab/totalPeso);
  var impInf=subDirecto*pImp*(wInf/totalPeso);

  /* Checkboxes: solo sumar los marcados */
  var chkPrep=document.getElementById('chkImpPrep');
  var chkLab=document.getElementById('chkImpLab');
  var chkInf=document.getElementById('chkImpInf');
  var incPrep=chkPrep?chkPrep.checked:true;
  var incLab=chkLab?chkLab.checked:true;
  var incInf=chkInf?chkInf.checked:false;
  var impTotal=(incPrep?impPrep:0)+(incLab?impLab:0)+(incInf?impInf:0);

  /* Mostrar resultados en peso rows */
  var rP=document.getElementById('resImpPrep');
  var rL=document.getElementById('resImpLab');
  var rI=document.getElementById('resImpInf');
  var tI=document.getElementById('totalImpPeso');
  if(rP)rP.innerHTML=(incPrep?'✓':'✗')+' ₲ '+fmtGs(impPrep)+' — <strong>USD '+fmtUsd(cot>0?impPrep/cot:0)+'</strong>';
  if(rL)rL.innerHTML=(incLab?'✓':'✗')+' ₲ '+fmtGs(impLab)+' — <strong>USD '+fmtUsd(cot>0?impLab/cot:0)+'</strong>';
  if(rI)rI.innerHTML=(incInf?'✓':'✗')+' ₲ '+fmtGs(impInf)+' — <strong>USD '+fmtUsd(cot>0?impInf/cot:0)+'</strong>';
  if(tI)tI.textContent='₲ '+fmtGs(impTotal)+' / USD '+fmtUsd(cot>0?impTotal/cot:0);

  /* Cálculo del monto final */
  var subConImp=subDirecto+impTotal;
  var pRet=V('pRet')/100;
  var retIva=subConImp*pRet;
  var totalCalcGs=subConImp+retIva;
  var totalCalcUsd=cot>0?totalCalcGs/cot:0;
  var totalSugerido=Math.ceil(totalCalcUsd/100)*100;

  /* Mostrar totales calculados + Margen SoilTech */
  var pctMargen=V('pctMargen')/100;
  var margenSoilGs=(sPrep+sLab)*pctMargen;
  var margenSoilUsd=cot>0?margenSoilGs/cot:0;
  var montoTotalGs=totalCalcGs+margenSoilGs;
  var montoTotalUsd=cot>0?montoTotalGs/cot:0;
  var totalSugerido=Math.ceil(montoTotalUsd/100)*100;

  setV('totalCalcGs','₲ '+fmtGs(totalCalcGs));
  setV('totalCalcUsd','USD '+fmtUsd(totalCalcUsd));
  setV('margenSoilGs','Gs. '+fmtGs(margenSoilGs));
  setV('margenSoilUsd','USD '+fmtUsd(margenSoilUsd));
  setV('montoTotalGs','Gs. '+fmtGs(montoTotalGs));
  setV('montoTotalUsd','USD '+fmtUsd(montoTotalUsd));
  setV('totalSugerido','USD '+fmtUsd(totalSugerido));

  /* Margen = montoSolicitar*cot - costoDirecto */
  var mEl=document.getElementById('montoSolicitar');
  var isManual=mEl&&mEl.dataset.manual==='1';
  var montoSol=0;
  var totalProyectoGs=0;
  var margen=0;

  if(isManual){
    /* Usuario fijó el monto manualmente — respetar */
    montoSol=V('montoSolicitar');
    totalProyectoGs=montoSol*cot;
    margen=totalProyectoGs-subDirecto;
  }else{
    /* Auto-calcular usando el sugerido redondeado */
    montoSol=totalSugerido;
    if(mEl)mEl.value=montoSol;
    totalProyectoGs=montoSol*cot;
    margen=totalProyectoGs-subDirecto;
  }

  var margenPct=totalProyectoGs>0?margen/totalProyectoGs:0;
  setV('margenResult',fmtUsd(margen/cot)+' USD ('+Math.round(margenPct*100)+'%)');

  /* Anticipo / Saldo */
  var pAntV=V('pAnt')/100;
  var antic=montoSol*pAntV;
  var saldo=montoSol-antic;

  /* Propuesta desglose a/b/c — proporcional como en Excel */
  var pP=subDirecto>0?sPrep/subDirecto:0;
  var pL=subDirecto>0?sLab/subDirecto:0;
  var pI=subDirecto>0?sInf/subDirecto:0;
  // Add proportional imprevisto + retención + margen
  var prP=montoSol*pP;
  var prL=montoSol*pL;
  var prI=montoSol*pI;
  // Adjust so they sum to montoSol
  var prSum=prP+prL+prI;
  if(prSum>0&&Math.abs(prSum-montoSol)>1){
    var adj=montoSol/prSum;prP*=adj;prL*=adj;prI*=adj;
  }
  // Round to nice numbers (hundreds)
  prP=Math.round(prP/100)*100;
  prL=Math.round(prL/100)*100;
  prI=montoSol-prP-prL;

  /* Flujo de caja 50/50 */
  var anticGs=antic*cot, saldoGs=saldo*cot;
  var egresosT1=sPrep+sLab; // campo + lab en tramo 1
  var egresosT2=sInf; // informe en tramo 2
  var saldoT1=anticGs-egresosT1;
  var saldoT2=saldoGs-egresosT2;

  /* Store R */
  R={
    /* Supuestos */
    cot:cot,cal:cal,mpc:mpc,bar:bar,mpb:mpb,tm:tm,tmCal:tmCal,tmBar:tmBar,sup:sup,
    nVehiculos:nVeh,diasCampo:diasCampo,diasTotal:diasTotal,nViajes:nViajes,
    distKm:V('distKm'),consumo:consumoL,pComb:pComb,cAlq:cAlq,personas:pers,
    cCons:V('cCons'),cHosp:V('cHosp'),
    /* Preparación campo */
    hon:hon,alq:costoAlqTotal,comb:costoCombTotal,cons:costoViaticos,hosp:costoHospedaje,
    equip:equipTotal,otros:otrosTotal,peaje:peaje,sPrep:sPrep,
    /* Lab e Informe */
    sLab:sLab,sInf:sInf,
    /* Consolidación */
    subDirecto:subDirecto,impPrep:impPrep,impLab:impLab,impInf:impInf,impTotal:impTotal,
    subConImp:subConImp,retIva:retIva,
    pctMargen:V('pctMargen'),margenSoilGs:margenSoilGs,
    /* Monto final */
    montoSolicitar:montoSol,totalProyectoGs:totalProyectoGs,margen:margen,margenPct:margenPct,
    totU:montoSol,totGs:totalProyectoGs,
    /* Propuesta */
    prP:prP,prL:prL,prI:prI,
    /* Pagos */
    pAnt:V('pAnt'),antic:antic,saldo:saldo,
    /* Flujo */
    anticGs:anticGs,saldoGs:saldoGs,egresosT1:egresosT1,egresosT2:egresosT2,
    saldoFlT1:saldoT1,saldoFlT2:saldoT2,
    /* Ratios */
    costoHa:cot>0?subDirecto/cot/sup:0,
    costoCal:cot>0?subDirecto/cot/cal:0,
    costoMuestra:cot>0?subDirecto/cot/tm:0,
    costoLabMuestra:cot>0?sLab/cot/tm:0,
    densHa:cal>0?sup/cal:0,
    /* Pesos */
    pesoPrep:V('pesoPrep'),pesoLab:V('pesoLab'),pesoInf:V('pesoInf'),
    pImp:V('pImp'),pRet:V('pRet')
  };
  renderSummary();
}

function calcSolicitar(){
  var el=document.getElementById('montoSolicitar');
  if(el){
    if(el.value&&parseFloat(el.value)>0){
      el.dataset.manual='1';
    }else{
      delete el.dataset.manual;
    }
  }
  calc();

function confirmApprove(){
  var p=approvingProject;if(!p)return;
  var nombre=document.getElementById('apNombre').value;
  var valorUsd=parseFloat(document.getElementById('apValor').value)||0;
  var descIva=(parseFloat(document.getElementById('apIva').value)||7)/100;
  var fechaInicio=document.getElementById('apFecha').value;
  var pct=parseFloat(document.getElementById('apPct').value)||50;
  var montoAnticipo=valorUsd*pct/100;
  var moneda=document.getElementById('apMoneda').value;
  db.collection('proyectos').doc(p.id).update({
    nombre:nombre.toUpperCase(),cliente:(p.cliente||'').toUpperCase(),
    valorUsd:valorUsd,descuentoIva:descIva,valorIva:valorUsd*descIva,valorTotal:valorUsd-(valorUsd*descIva),
    estado:'En Curso',fechaInicio:fechaInicio?new Date(fechaInicio+'T12:00:00'):null,fechaFin:null,
    fechaRegistro:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    var pres=p.presupuesto||{};
    var asig={Maquinaria:pres.alq||0,Combustible:pres.comb||0,'Consumición':pres.cons||0,Hospedaje:pres.hosp||0,Colaboradores:pres.hon||0,'Implementos de trabajo':pres.otros||0,Laboratorio:pres.sLab||0,Peaje:pres.peaje||0,Varios:pres.equip||0};
    var promises=[];
    Object.keys(asig).forEach(function(k){if(asig[k]>0)promises.push(db.collection('proyectos').doc(p.id).collection('asignaciones').doc(k).set({monto:asig[k],categoria:k}))});
    return Promise.all(promises);
  }).then(function(){
    return db.collection('facturas').orderBy('numero','desc').limit(1).get();
  }).then(function(s){
    var fNum=s.empty?271:s.docs[0].data().numero+1;
    var svc=SERVICIOS.find(function(sv){return sv.code===p.tipoServicio})||SERVICIOS[0];
    return db.collection('facturas').add({
      numero:fNum,nroFormateado:'001-001-'+String(fNum).padStart(7,'0'),
      fecha:new Date().toISOString().split('T')[0],condicion:'CONTADO',moneda:moneda,tipoIva:10,
      cliente:p.cliente,ruc:'',direccion:'',telefono:'',
      items:[{cant:1,code:p.tipoServicio||'ST-07',desc:'ANTICIPO '+pct+'% - '+svc.name,unit:montoAnticipo}],
      total:montoAnticipo,ivaAmount:montoAnticipo/11,
      estado:'activa',impresa:false,enviada:false,pagada:false,
      proyectoId:p.id,tipo:'anticipo',createdAt:firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){
      var retencion=descIva;
      var montoFinalUsd=montoAnticipo-(montoAnticipo*retencion);
      return db.collection('pagos_recibidos').add({
        proyectoId:p.id,proyectoNombre:nombre.toUpperCase(),concepto:'Anticipo '+pct+'%',
        montoUsd:montoAnticipo,retencion:retencion,montoFinalUsd:montoFinalUsd,
        cotizacion:p.cotizacion||6500,montoFinalGs:montoFinalUsd*(p.cotizacion||6500),
        fecha:new Date()
      });
    });
  }).then(function(){
    hideModal('approveModal');
    document.getElementById('postApproveMsg').textContent='Proyecto "'+nombre+'" activado con factura anticipo por USD '+fmtUsd(montoAnticipo);
    showModal('postApproveModal');
  }).catch(function(e){toast('❌ '+e.message)});
}

function exportXlsx(){
  if(typeof XlsxPopulate==='undefined'){toast('❌ Librería xlsx-populate no cargó');return;}
  var p=ALL.find(function(x){return x._id===editingId});
  if(!p||!p.presupuesto){toast('❌ Sin datos de presupuesto');return;}
  toast('⏳ Generando Excel...');
  var xhr=new XMLHttpRequest();
  xhr.open('GET','TEMPLATE_PRESUPUESTO.xlsx',true);
  xhr.responseType='arraybuffer';
  xhr.onload=function(){
    if(xhr.status!==200){toast('❌ Template no encontrado — copiá TEMPLATE_PRESUPUESTO.xlsx a la carpeta presupuesto/');return;}
    XlsxPopulate.fromDataAsync(xhr.response).then(function(wb){
      fillTemplate(wb,p);
      return wb.outputAsync();
    }).then(function(blob){
      var safeName=(p.nombre||'PRESUPUESTO').replace(/[^\w]/g,'_');
      var url=URL.createObjectURL(new Blob([blob],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
      var a=document.createElement('a');a.href=url;a.download='Presupuesto_'+safeName+'.xlsx';a.click();
      URL.revokeObjectURL(url);
      toast('✅ Excel exportado con formato');
    }).catch(function(e){console.error('Export error:',e);toast('❌ Error: '+e.message);});
  };
  xhr.onerror=function(){toast('❌ Error de red al cargar template');};
  xhr.send();
}
function fillTemplate(wb,p){
  var pr=p.presupuesto||{};var c=pr.cot||p.cotizacion||6500;
  var u=function(gs){return c>0?gs/c:0};
  var S=function(ws,ref,val){try{ws.cell(ref).value(val);}catch(e){}};
  /* ═══ SUPUESTOS ═══ */
  var ws=wb.sheet('SUPUESTOS');
  if(ws){
    S(ws,'C4',c);S(ws,'C5',(pr.pImp||10)/100);S(ws,'C6',(pr.pRet||7)/100);S(ws,'C7',(pr.pAnt||50)/100);S(ws,'C8',(100-(pr.pAnt||50))/100);
    S(ws,'C12',p.nombre||'');S(ws,'C13',pr.cal||0);S(ws,'C14',pr.mpc||3);S(ws,'C15',pr.bar||0);S(ws,'C16',pr.mpb||1);
    S(ws,'C17',pr.tmCal||0);S(ws,'C18',pr.tmBar||0);S(ws,'C19',pr.tm||0);S(ws,'C20',pr.sup||0);S(ws,'C21',pr.densHa||0);
    S(ws,'C24',pr.nVehiculos||2);S(ws,'C25',pr.diasCampo||4);S(ws,'C26',pr.diasTotal||5);S(ws,'C27',pr.distKm||350);S(ws,'C28',pr.nViajes||2);
    S(ws,'C29',pr.consumo||12);S(ws,'C30',pr.pComb||9000);S(ws,'C31',pr.cAlq||715000);S(ws,'C32',pr.personas||4);S(ws,'C33',pr.cCons||100000);S(ws,'C34',pr.cHosp||100000);
    var litros=(pr.distKm||350)*(pr.consumo||12)/100;
    S(ws,'C37',litros);S(ws,'C38',litros*1.2);S(ws,'C39',pr.comb||0);S(ws,'C40',pr.alq||0);S(ws,'C41',pr.cons||0);S(ws,'C42',pr.hosp||0);
  }
  /* ═══ Preparación_campo ═══ */
  ws=wb.sheet('Preparación_campo');
  if(ws){
    var hon=p.honorarios||[];
    for(var i=0;i<7;i++){var row=5+i;var h=hon[i]||{};
      S(ws,'C'+row,h.nombre||'');S(ws,'D'+row,h.cantidad||0);S(ws,'E'+row,h.unidad||'Honorario fijo');S(ws,'F'+row,h.dias||0);S(ws,'G'+row,h.costoUnit||0);
      var sub=0;if(h.unidad==='Por calicata')sub=(h.cantidad||0)*(h.costoUnit||0)*(pr.cal||0);else sub=(h.cantidad||0)*(h.costoUnit||0)*(h.dias||0);
      S(ws,'H'+row,sub);S(ws,'I'+row,u(sub));
    }
    S(ws,'H12',pr.hon||0);S(ws,'I12',u(pr.hon||0));
    S(ws,'H14',pr.alq||0);S(ws,'I14',u(pr.alq||0));S(ws,'H15',pr.comb||0);S(ws,'I15',u(pr.comb||0));
