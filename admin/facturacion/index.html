<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoilTech — Facturación</title>
<link rel="stylesheet" href="../ui.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#F4F0E8;--sf:#fff;--sf2:#EDE9E0;--g:#34A678;--gd:#18403E;--gl:rgba(52,166,120,0.08);--tx:#1A1A1A;--tx2:#6B6B6B;--tx3:#9CA3AF;--bd:#E0DDD5;--dg:#EF4444;--warn:#F59E0B;--info:#3B82F6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--gd);color:var(--tx);height:100vh;overflow:hidden}
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
.tb{display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--gd);border-bottom:1px solid rgba(255,255,255,0.08)}
.tb h1{font-size:15px;color:#fff}.tb a{color:rgba(255,255,255,0.4);text-decoration:none;font-size:11px;margin-left:12px}.tb a:hover{color:#fff}
.tb-r{display:flex;gap:6px}
.btn{padding:7px 14px;border-radius:6px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;border:none;transition:all .15s}
.btn-g{background:var(--g);color:#fff}.btn-g:hover{background:#2D9068}
.btn-w{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.12)}.btn-w:hover{background:rgba(255,255,255,0.15)}
.btn-info{background:var(--info);color:#fff}.btn-dg{background:var(--dg);color:#fff}
.main{overflow-y:auto;background:var(--bg);padding:20px 24px}
/* Stats */
.stats{display:flex;gap:10px;margin-bottom:14px}.stat{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;flex:1;text-align:center}
.stat .v{font-size:18px;font-weight:700;color:var(--gd)}.stat .l{font-size:9px;color:var(--tx2);text-transform:uppercase}
/* Search */
.toolbar{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.toolbar input{flex:1;padding:7px 12px;border:1px solid var(--bd);border-radius:6px;font-family:inherit;font-size:12px;background:var(--sf)}
.toolbar select{padding:7px 8px;border:1px solid var(--bd);border-radius:6px;font-size:11px;background:var(--sf)}
/* Table */
.ft{width:100%;border-collapse:collapse;background:var(--sf);border-radius:8px;overflow:hidden;border:1px solid var(--bd)}
.ft th{font-size:9px;font-weight:600;color:var(--tx3);padding:8px 10px;text-align:left;text-transform:uppercase;background:var(--sf2);border-bottom:1px solid var(--bd)}
.ft td{padding:7px 10px;font-size:12px;border-bottom:1px solid var(--bd)}
.ft tr:hover td{background:var(--gl);cursor:pointer}
.ft .mono{font-family:monospace;font-weight:600;color:var(--gd);font-size:10px}
.ft .amt{font-weight:700;text-align:right;white-space:nowrap}
.ft .desc{max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--tx2)}
.badge{display:inline-block;font-size:8px;font-weight:700;padding:2px 5px;border-radius:6px;margin-right:1px}
.ba{background:rgba(52,166,120,0.1);color:var(--g)}.bv{background:rgba(239,68,68,0.1);color:var(--dg)}
.bi{background:#6B7280;color:#fff}.be{background:var(--info);color:#fff}.bp{background:var(--g);color:#fff}
.bw{background:rgba(0,0,0,0.04);color:var(--tx3)}
/* Side panel */
.side-bg{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:50;display:none}.side-bg.show{display:block}
.side{position:fixed;top:0;right:-540px;width:520px;height:100vh;background:var(--sf);overflow-y:auto;padding:24px;box-shadow:-4px 0 30px rgba(0,0,0,0.2);transition:right .25s ease;z-index:51}
.side.show{right:0}
.cm-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}.cm-bg.show{display:flex}
.cm{background:var(--sf);border-radius:14px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;padding:24px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.cm h3{font-size:16px;color:var(--gd);margin-bottom:4px}.cm .sub{font-size:12px;color:var(--tx2);margin-bottom:14px}
.cm .x{position:absolute;top:10px;right:14px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--tx3)}
.cm-dup{padding:8px 10px;border-radius:8px;background:#FFF7ED;border:1px solid #FED7AA;color:#92400E;font-size:11px;margin-bottom:8px}
/* ═══ Calibrador de impresión ═══ */
.cal{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column}
.cal-top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--gd);color:#fff;flex-wrap:wrap}
.cal-top strong{font-size:14px}
.cal-hint{font-size:11px;color:rgba(255,255,255,0.6);flex:1;min-width:200px}
.cal-acts{display:flex;gap:6px;flex-wrap:wrap}
.cal-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);color:#fff;border-radius:7px;padding:7px 11px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.cal-btn:hover{background:rgba(255,255,255,0.2)}
.cal-btn.ok{background:var(--g);border-color:var(--g)}
.cal-body{flex:1;display:grid;grid-template-columns:1fr 330px;overflow:hidden}
.cal-canvas{overflow:auto;padding:20px;background:#DAD5CA}
.cal-sheet{position:relative;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,0.2);margin:0 auto}
.cal-bg{position:absolute;pointer-events:none}
.cal-gl{position:absolute;background:rgba(24,64,62,0.10)}
.cal-gl.v{top:0;bottom:0;width:1px}.cal-gl.h{left:0;right:0;height:1px}
.cal-fila{position:absolute;left:0;height:1px;background:rgba(59,130,246,0.25)}
.cal-f{position:absolute;color:#000;background:rgba(52,166,120,0.12);border:1px dashed rgba(52,166,120,0.6);border-radius:2px;cursor:move;white-space:nowrap;overflow:hidden;line-height:1.15;touch-action:none}
.cal-f.item{background:rgba(59,130,246,0.12);border-color:rgba(59,130,246,0.6)}
.cal-f.sel{background:rgba(245,158,11,0.25);border:1px solid var(--warn);box-shadow:0 0 0 2px rgba(245,158,11,0.3);z-index:5}
.cal-side{overflow-y:auto;background:var(--sf);border-left:1px solid var(--bd);padding:14px}
.cal-box{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.cal-box h4{font-size:11px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.cal-row{display:flex;gap:8px;margin-bottom:6px}
.cal-in{flex:1;display:block}
.cal-in span{display:block;font-size:10px;color:var(--tx2);margin-bottom:2px}
.cal-in input,.cal-in select{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;font-family:inherit;font-size:12px;background:var(--bg)}
.cal-in input[type=checkbox]{width:auto}
.cal-lista{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.cal-g{font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase;margin:6px 0 2px}
.cal-item{text-align:left;border:none;background:none;font-family:inherit;font-size:12px;color:var(--tx);padding:5px 7px;border-radius:6px;cursor:pointer}
.cal-item:hover{background:var(--gl)}
.cal-item.on{background:var(--gd);color:#fff;font-weight:700}
.cal-nota{font-size:10px;color:var(--tx3);margin-top:6px}
@media (max-width:900px){.cal-body{grid-template-columns:1fr}.cal-side{border-left:none;border-top:1px solid var(--bd)}}
.guardar-cli{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--gd);background:var(--gl);border:1px solid rgba(52,166,120,0.25);border-radius:6px;padding:6px 8px;margin:2px 0 6px;cursor:pointer}
.guardar-cli input{accent-color:var(--g)}
.side .x{position:absolute;top:12px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--tx3)}
.sec{font-size:10px;font-weight:700;color:var(--g);text-transform:uppercase;margin:14px 0 6px;letter-spacing:1px}
.f{margin-bottom:6px}.f label{display:block;font-size:9px;font-weight:600;color:var(--tx2);text-transform:uppercase;margin-bottom:1px}
.f input,.f select{width:100%;padding:6px 9px;border:1px solid var(--bd);border-radius:5px;font-family:inherit;font-size:12px;background:var(--bg)}
.f input:focus,.f select:focus{outline:none;border-color:var(--g)}
.f input[readonly]{background:var(--sf2);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.itbl{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}.itbl th{font-size:8px;font-weight:600;color:var(--tx3);padding:3px 4px;border-bottom:1px solid var(--bd);text-align:left}.itbl td{padding:2px 3px}
.itbl input,.itbl select{padding:3px 5px;font-size:11px}
.ab{background:none;border:1px dashed var(--g);color:var(--g);padding:3px 8px;border-radius:4px;cursor:pointer;font-size:10px;font-weight:600;margin-top:4px}
.rm{background:none;border:none;color:var(--dg);cursor:pointer;font-size:14px}
.sr{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}.sr.tot{font-size:16px;font-weight:700;color:var(--gd);border-top:2px solid var(--g);padding-top:6px;margin-top:4px}
/* Print */
.pp{width:216mm;height:330mm;position:relative;display:none;background:#fff}
.ic{position:absolute;left:0;width:216mm;height:160mm;overflow:hidden}.ic1{top:0}.ic2{top:165mm}
.pf{position:absolute;color:#000;line-height:1.2}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 20px;border-radius:6px;font-size:12px;font-weight:600;opacity:0;transition:opacity .3s;z-index:200}.toast.show{opacity:1}
@media print{body,.app{display:block;height:auto;overflow:visible;background:#fff}.tb,.st-top,.main,.side-bg,.side,.cal,.cm-bg{display:none!important}.pp{display:block!important;box-shadow:none}@page{size:216mm 330mm;margin:0}}
</style>
</head>
<body>
<div class="app">
  <header class="st-top">
    <a class="st-brand" href="../"><span class="st-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M3 7c3-2 6 2 9 0s6-2 9 0"/><path d="M3 12c3-2 6 2 9 0s6-2 9 0"/><path d="M3 17c3-2 6 2 9 0s6-2 9 0"/></svg></span><span>SoilTech <b>Admin</b></span></a>
    <nav class="st-nav"><a href="../">Inicio</a><a href="../presupuesto/">Presupuestos</a><a href="../presupuesto/#/balance">Balance</a><a href="../clientes/">Clientes</a><a class="on" href="./">Facturación</a></nav>
    <div class="st-right">
      <button class="st-btn st-btn-ghost" id="seedBtn" onclick="seedHistorical()" style="display:none">📥 Cargar historial Excel</button>
      <button class="st-btn st-btn-ghost" onclick="abrirCalibracion(db)" title="Ajustar dónde se imprime cada dato sobre la hoja preimpresa">🖨 Calibrar impresión</button>
      <button class="st-btn st-btn-g" onclick="openNew()">+ Nueva factura</button>
    </div>
  </header>
  <div class="main">
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input id="search" placeholder="Buscar cliente, servicio, nro..." oninput="renderList()">
      <select id="filt" onchange="renderList()"><option value="all">Todas</option><option value="activa">Activas</option><option value="anulada">Anuladas</option><option value="pagada">Pagadas</option><option value="pendiente">Sin pagar</option></select>
    </div>
    <table class="ft"><thead><tr><th>Nro</th><th>Fecha</th><th>Cliente</th><th>Descripción</th><th>Moneda</th><th style="text-align:right">Monto</th><th>Estado</th></tr></thead><tbody id="tbody"></tbody></table>
  </div>
</div>

<!-- Side panel for detail/edit/new -->
<div class="side-bg" id="sideBg" onclick="closePanel()"></div>
<div class="side" id="sidePanel">
  <button class="x" onclick="closePanel()">×</button>
  <div id="sideContent"></div>
</div>

<!-- Nuevo cliente -->
<div class="cm-bg" id="cliModal"><div class="cm"><button class="x" onclick="cerrarNuevoCli()">×</button>
  <h3>Nuevo cliente</h3><div class="sub">Se guarda en la lista de clientes (también la usa la app).</div>
  <div id="ncDup"></div>
  <div class="f"><label>Razón social / Nombre *</label><input id="ncNombre" oninput="dupNuevoCli()"></div>
  <div class="g2"><div class="f"><label>RUC / CI</label><input id="ncRuc" oninput="dupNuevoCli()"></div><div class="f"><label>Teléfono</label><input id="ncTel"></div></div>
  <div class="g2"><div class="f"><label>Departamento</label><select id="ncDepto"><option value="">— Seleccionar —</option></select></div><div class="f"><label>Localidad</label><input id="ncLocal"></div></div>
  <div class="f"><label>Persona de contacto</label><input id="ncContacto"></div>
  <div class="f"><label>Dirección</label><input id="ncDir"></div>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-g" id="ncGuardar" style="flex:1;padding:10px" onclick="guardarNuevoCli()">Guardar y usar en la factura</button><button class="btn" style="background:var(--sf2);color:var(--tx)" onclick="cerrarNuevoCli()">Cancelar</button></div>
</div></div>

<!-- Registrar cobro -->
<div class="cm-bg" id="cobroModal"><div class="cm" style="max-width:480px"><button class="x" onclick="cerrarCobro()">×</button>
  <h3>Registrar cobro</h3><div class="sub" id="cbSub"></div>
  <div id="cbNota"></div>
  <div class="g2"><div class="f"><label>Fecha de cobro</label><input id="cbFecha" type="date"></div><div class="f"><label id="cbMontoL">Monto cobrado</label><input id="cbMonto" type="number" step="0.01" oninput="calcCobro()"></div></div>
  <div class="g2"><div class="f"><label>Retención (%)</label><input id="cbRet" type="number" step="0.1" oninput="calcCobro()"><div style="font-size:9px;color:var(--tx3)">0 si el cliente no retuvo nada</div></div><div class="f"><label>Cotización Gs/USD</label><input id="cbCot" type="number" oninput="calcCobro()"><div style="font-size:9px;color:var(--tx3)">Del día del cobro</div></div></div>
  <div id="cbPrev" style="background:var(--sf2);border-radius:8px;padding:10px 12px;font-size:12px;margin:6px 0 12px"></div>
  <div style="display:flex;gap:8px"><button class="btn btn-g" id="cbGuardar" style="flex:1;padding:10px" onclick="guardarCobro()">💰 Marcar pagada y sumar al balance</button><button class="btn" style="background:var(--sf2);color:var(--tx)" onclick="cerrarCobro()">Cancelar</button></div>
</div></div>

<!-- Print page -->
<div class="pp" id="pp"></div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../config.js"></script>
<script src="../auth-guard.js"></script>
<script src="impresion.js"></script>
<script src="../facturas_seed.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
var db=firebase.firestore();
var ALL=[],CLIS=[],PROYS=[],curId=null,curF=null,isNew=false;
function escH(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var DEPTOS=['Asunción','Alto Paraguay','Alto Paraná','Amambay','Boquerón','Caaguazú','Caazapá','Canindeyú','Central','Concepción','Cordillera','Guairá','Itapúa','Misiones','Ñeembucú','Paraguarí','Presidente Hayes','San Pedro'];
function normCli(s){return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\b(S\.?\s?A\.?|S\.?R\.?L\.?|E\.?A\.?S\.?)\b/g,'').replace(/[^A-Z0-9]/g,'')}
function normRuc(s){return String(s||'').toUpperCase().replace(/[^0-9A-Z]/g,'')}
function buscarCli(nombre,ruc){
  var n=normCli(nombre),r=normRuc(ruc);
  return CLIS.find(function(c){
    if(r&&normRuc(c.ruc||c.documento)===r)return true;
    return !!n&&[c.nombre].concat(c.nombresAnteriores||[]).some(function(x){return normCli(x)===n});
  });
}
function proyNombre(id){var p=PROYS.find(function(x){return x.id===id});return p?p.nombre:''}
var SVCS=SERVICIOS.map(function(s){return{c:s.code,n:s.name}});

initAuthGuard(function(){loadAll(true);cargarConfigImpresion(db)});

/* ═══ Load ═══ */
function loadAll(primera){
  Promise.all([db.collection('facturas').orderBy('numero','desc').get(),db.collection('clientes').get(),db.collection('proyectos').get()]).then(function(r){
    var ORD={'En Curso':0,'Cotización':1,'Finalizado':2};
    PROYS=r[2].docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return (ORD[a.estado]!=null?ORD[a.estado]:3)-(ORD[b.estado]!=null?ORD[b.estado]:3)||(a.nombre||'').localeCompare(b.nombre||'')});
    ALL=r[0].docs.map(function(d){return Object.assign({_id:d.id},d.data())});
    CLIS=r[1].docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return (a.nombre||'').localeCompare(b.nombre||'')});
    if(ALL.length===0&&typeof HISTORICAL_FACTURAS!=='undefined')document.getElementById('seedBtn').style.display='block';
    renderStats();renderList();
    // Acceso rápido desde el inicio: ../facturacion/#nueva
    // Accesos directos: #nueva · #nueva/p/<proyecto> · #f/<factura>
    if(primera&&location.hash){
      var h=location.hash,m;
      history.replaceState(null,'',location.pathname);
      if((m=h.match(/^#nueva\/p\/(.+)$/)))openNew(decodeURIComponent(m[1]));
      else if((m=h.match(/^#nueva\/c\/(.+)$/)))openNew(null,decodeURIComponent(m[1]));
      else if(h==='#nueva')openNew();
      else if((m=h.match(/^#f\/(.+)$/)))openDetail(decodeURIComponent(m[1]));
    }
  });
}

/* ═══ Seed historical data ═══ */
function seedHistorical(){
  if(!confirm('¿Cargar '+HISTORICAL_FACTURAS.length+' facturas históricas del Excel?'))return;
  var batch=db.batch();
  HISTORICAL_FACTURAS.forEach(function(f){
    var ref=db.collection('facturas').doc();
    batch.set(ref,Object.assign({},f,{createdAt:firebase.firestore.FieldValue.serverTimestamp()}));
  });
  batch.commit().then(function(){
    toast('✅ '+HISTORICAL_FACTURAS.length+' facturas cargadas');
    document.getElementById('seedBtn').style.display='none';
    loadAll();
  }).catch(function(e){toast('❌ '+e.message)});
}

/* ═══ Stats ═══ */
function renderStats(){
  var act=ALL.filter(function(f){return f.estado==='activa'});
  var tU=0,tG=0,pag=0;
  act.forEach(function(f){if((f.moneda||'').includes('DOLAR'))tU+=(f.total||0);else tG+=(f.total||0);if(f.pagada)pag++});
  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="v">'+ALL.length+'</div><div class="l">Total</div></div>'+
    '<div class="stat"><div class="v">USD '+fmtUsd(tU)+'</div><div class="l">Facturado USD</div></div>'+
    '<div class="stat"><div class="v">₲ '+fmtGs(tG)+'</div><div class="l">Facturado Gs</div></div>'+
    '<div class="stat"><div class="v">'+pag+'/'+act.length+'</div><div class="l">Pagadas</div></div>';
}

/* ═══ List ═══ */
function renderList(){
  var q=(document.getElementById('search').value||'').toLowerCase();
  var fl=document.getElementById('filt').value;
  var list=ALL.filter(function(f){
    var desc=f.items&&f.items[0]?f.items[0].desc:(f.servicio||'');
    var txt=(f.cliente||'')+' '+(f.nroFormateado||'')+' '+desc+' '+(f.proyectoNombre||proyNombre(f.proyectoId));
    var mq=!q||txt.toLowerCase().includes(q);
    var mf=fl==='all'||(fl==='activa'&&f.estado==='activa')||(fl==='anulada'&&f.estado==='anulada')||(fl==='pagada'&&f.pagada)||(fl==='pendiente'&&f.estado==='activa'&&!f.pagada);
    return mq&&mf;
  });
  document.getElementById('tbody').innerHTML=list.map(function(f){
    var desc=f.items&&f.items[0]?f.items[0].desc:(f.servicio||'');
    var isU=(f.moneda||'').includes('DOLAR');
    var mon=isU?'USD':'Gs';
    var amt=isU?fmtUsd(f.total||0):fmtGs(f.total||0);
    var st='';
    if(f.estado==='anulada')st='<span class="badge bv">ANULADA</span>';
    else{
      st='<span class="badge ba">ACT</span>';
      if(f.impresa)st+='<span class="badge bi">IMP</span>';
      if(f.enviada)st+='<span class="badge be">ENV</span>';
      if(f.pagada)st+='<span class="badge bp">PAG</span>';
    }
    return'<tr onclick="openDetail(\''+f._id+'\')"><td class="mono">'+(f.nroFormateado||'—')+'</td><td style="font-size:11px;white-space:nowrap">'+(f.fecha||'')+'</td><td style="font-size:12px;font-weight:500">'+(f.cliente||'')+((f.proyectoId)?'<div style="font-size:10px;font-weight:600;color:var(--g)">'+escH(proyNombre(f.proyectoId)||f.proyectoNombre||'')+'</div>':'')+'</td><td class="desc">'+desc+'</td><td>'+mon+'</td><td class="amt">'+amt+'</td><td>'+st+'</td></tr>';
  }).join('');
}

/* ═══ Detail / Edit ═══ */
function openDetail(id){
  curId=id;isNew=false;
  curF=ALL.find(function(f){return f._id===id});
  if(!curF)return;
  renderSide();
  openPanel();
}

function openNew(proyectoId,clienteId){
  isNew=true;curId=null;
  // Get next number
  var maxNum=ALL.reduce(function(m,f){return Math.max(m,f.numero||0)},270);
  curF={numero:maxNum+1,nroFormateado:'001-001-'+String(maxNum+1).padStart(7,'0'),fecha:new Date().toISOString().split('T')[0],cliente:'',ruc:'',direccion:'',telefono:'',condicion:'CONTADO',moneda:'DOLARES AMERICANOS',tipoIva:10,items:[{cant:1,code:'',desc:'',unit:0}],total:0,ivaAmount:0,estado:'activa',impresa:false,enviada:false,pagada:false};
  var cl=clienteId&&CLIS.find(function(x){return x.id===clienteId});
  if(cl){curF.cliente=cl.nombre||'';curF.ruc=cl.ruc||cl.documento||'';curF.direccion=cl.direccion||'';curF.telefono=cl.telefono||''}
  var pr=proyectoId&&PROYS.find(function(x){return x.id===proyectoId});
  if(pr){
    curF.proyectoId=pr.id;
    curF.cliente=pr.cliente||'';
    var c=CLIS.find(function(x){return (x.nombre||'').toUpperCase()===(pr.cliente||'').toUpperCase()});
    if(c){curF.ruc=c.ruc||c.documento||'';curF.direccion=c.direccion||'';curF.telefono=c.telefono||''}
    if(pr.tipoServicio){var sv=SVCS.find(function(x){return x.c===pr.tipoServicio});curF.items=[{cant:1,code:pr.tipoServicio,desc:sv?sv.n:'',unit:0}]}
  }
  renderSide();
  openPanel();
}

  var isU=(f.moneda||'').includes('DOLAR');
  var mon=isU?'USD':'Gs';
  var amt=isU?fmtUsd(f.total||0):fmtGs(f.total||0);

  var h='<h2 style="font-size:16px;font-weight:700;color:var(--gd);margin-bottom:4px">'+(isNew?'Nueva Factura':'Factura '+(f.nroFormateado||''))+'</h2>';

  // Status badges (only for existing)
  if(!isNew){
    h+='<div style="margin:8px 0 12px">';

    else{
      h+='<span class="badge ba" style="font-size:10px;padding:3px 8px">ACTIVA</span> ';
      h+=mkBadge('impresa','🖨 Impresa','bi');
      h+=mkBadge('enviada','📤 Enviada','be');
      h+=mkBadge('pagada','💰 Pagada','bp');
    }
    h+='</div>';
  }

  if(!isNew&&!vo&&f.pagada&&f.proyectoId&&!f.pagoRecibidoId){
    h+='<div style="margin:0 0 10px;padding:8px 10px;border-radius:8px;background:#FFF7ED;border:1px solid #FED7AA;color:#92400E;font-size:11px">Esta factura está pagada pero su cobro no figura en el balance del proyecto. <a href="#" onclick="abrirCobro();return false" style="color:inherit;font-weight:700">Registrar cobro</a></div>';
  }
  if(!isNew&&f.pagada&&f.pagoRecibidoId){
    h+='<div style="margin:0 0 10px;padding:8px 10px;border-radius:8px;background:rgba(52,166,120,0.08);border:1px solid rgba(52,166,120,0.25);color:#1F7A56;font-size:11px">Cobro registrado en el balance del proyecto'+(f.fechaPago?' · '+escH(f.fechaPago):'')+'.</div>';
  }
  h+='<div class="sec">Factura</div>';
  h+='<div class="g2"><div class="f"><label>Nro. Factura</label><input id="sfNro" value="'+(f.nroFormateado||'')+'" readonly></div><div class="f"><label>Fecha</label><input id="sfFecha" type="'+(isNew?'date':'text')+'" value="'+(f.fecha||'')+'"></div></div>';
  h+='<div class="g3"><div class="f"><label>Condición</label><select id="sfCond"><option'+(f.condicion==='CONTADO'?' selected':'')+'>CONTADO</option><option'+(f.condicion==='CREDITO'?' selected':'')+'>CREDITO</option></select></div><div class="f"><label>Moneda</label><select id="sfMoneda" onchange="recalcSide()"><option'+(isU?' selected':'')+'>DOLARES AMERICANOS</option><option'+(!isU?' selected':'')+'>GUARANIES</option></select></div><div class="f"><label>IVA</label><select id="sfIva" onchange="recalcSide()"><option value="10"'+(f.tipoIva!=5&&f.tipoIva!=0?' selected':'')+'>10%</option><option value="5"'+(f.tipoIva==5?' selected':'')+'>5%</option><option value="0"'+(f.tipoIva==0?' selected':'')+'>Exenta</option></select></div></div>';

  h+='<div class="sec">Proyecto</div>';
  h+='<div class="f" style="display:flex;gap:6px;align-items:center"><select id="sfProy" onchange="onSfProy()" style="flex:1"><option value="">— Sin proyecto —</option>';
  var grupo='';
  PROYS.forEach(function(p){
    var g=p.estado||'Otros';
    if(g!==grupo){if(grupo)h+='</optgroup>';h+='<optgroup label="'+escH(g)+'">';grupo=g}
    h+='<option value="'+escH(p.id)+'"'+(f.proyectoId===p.id?' selected':'')+'>'+escH(p.nombre||'Sin nombre')+(p.cliente?' — '+escH(p.cliente):'')+'</option>';
  });
  if(grupo)h+='</optgroup>';
  if(f.proyectoId&&!PROYS.some(function(p){return p.id===f.proyectoId}))h+='<option value="'+escH(f.proyectoId)+'" selected>'+escH(f.proyectoNombre||'Proyecto borrado')+'</option>';
  h+='</select><a id="sfProyLink" href="#" style="font-size:11px;font-weight:700;color:var(--g);text-decoration:none;white-space:nowrap">Ver balance →</a></div>';
  h+='<div class="sec">Cliente</div>';
  h+='<div class="f"><label>Razón Social</label>';
  if(isNew){
    h+='<div style="display:flex;gap:4px;margin-bottom:4px"><select id="sfCliSel" onchange="onSfCli()" style="flex:1"><option value="">— Seleccionar o escribir abajo —</option>';
    var elegido=f.cliente?buscarCli(f.cliente,f.ruc):null;
    CLIS.forEach(function(c){h+='<option value="'+escH(c.id)+'"'+(elegido&&elegido.id===c.id?' selected':'')+'>'+escH(c.nombre)+(c.ruc?' · '+escH(c.ruc):'')+'</option>'});
    h+='</select><button type="button" class="btn btn-g" style="white-space:nowrap" onclick="abrirNuevoCli()" title="Agregar un cliente a la lista">+ Nuevo</button></div>';

  h+='<input id="sfCliente" value="'+escH(f.cliente||'')+'"'+(isNew?' oninput="revisarCliNuevo()" placeholder="O escribí el nombre acá"':'')+'></div>';
  h+='<div class="g2"><div class="f"><label>RUC / CI</label><input id="sfRuc" value="'+escH(f.ruc||'')+'"'+(isNew?' oninput="revisarCliNuevo()"':'')+'></div><div class="f"><label>Teléfono</label><input id="sfTel" value="'+(f.telefono||'')+'"></div></div>';
  h+='<div class="f"><label>Dirección</label><input id="sfDir" value="'+escH(f.direccion||'')+'"></div>';
  if(isNew)h+='<label class="guardar-cli" id="sfGuardarCliWrap" style="display:none"><input type="checkbox" id="sfGuardarCli" checked> Este cliente no está en la lista: guardarlo al crear la factura</label>';

  h+='<div class="sec">Ítems</div>';
  h+='<table class="itbl"><thead><tr><th style="width:35px">Cant</th><th style="width:65px">Código</th><th>Descripción</th><th style="width:80px">Precio</th><th style="width:20px"></th></tr></thead><tbody id="sfItems">';
  (f.items||[it]).forEach(function(item,idx){
    h+='<tr><td><input type="number" value="'+(item.cant||1)+'" style="width:35px" oninput="recalcSide()"></td>';
    h+='<td><select style="width:65px" onchange="onSfSvc(this)"><option value="">—</option>';
    SVCS.forEach(function(s){h+='<option value="'+s.c+'"'+(item.code===s.c?' selected':'')+'>'+s.c+'</option>'});
    h+='</select></td>';
    h+='<td><input value="'+(item.desc||'')+'" style="width:100%" oninput="recalcSide()"></td>';
    h+='<td><input type="number" value="'+(item.unit||0)+'" style="width:80px" oninput="recalcSide()"></td>';
    h+='<td><button class="rm" onclick="this.closest(\'tr\').remove();recalcSide()">×</button></td></tr>';
  });
  h+='</tbody></table>';
  h+='<button class="ab" onclick="addSfItem()">+ Línea</button>';

  h+='<div class="sec">Totales</div>';
  h+='<div id="sfTotals"></div>';

  // Actions
  h+='<div style="display:flex;gap:6px;margin-top:16px;flex-wrap:wrap">';
  if(isNew){
    h+='<button class="btn btn-g" style="flex:1;padding:10px" onclick="saveFactura()">💾 Guardar Factura</button>';
  }else if(!vo){
    h+='<button class="btn btn-g" style="flex:1" onclick="saveFactura()">💾 Guardar</button>';
    h+='<button class="btn btn-info" onclick="printFactura()">🖨️ Imprimir</button>';
    h+='<button class="btn btn-dg" onclick="anularFactura()">Anular</button>';
  }
  h+='</div>';

  document.getElementById('sideContent').innerHTML=h;
  actualizarLinkProy();
  if(isNew)revisarCliNuevo();
  recalcSide();
}

function actualizarLinkProy(){
  var s=document.getElementById('sfProy'),a=document.getElementById('sfProyLink');
  if(!s||!a)return;
  a.style.display=s.value?'':'none';
  a.href='../presupuesto/#/p/'+encodeURIComponent(s.value)+'/balance';
}
function onSfProy(){
  actualizarLinkProy();
  var p=PROYS.find(function(x){return x.id===document.getElementById('sfProy').value});
  var cli=document.getElementById('sfCliente');
  if(p&&isNew&&cli&&!cli.value.trim()&&p.cliente){
    cli.value=p.cliente;
    var c=CLIS.find(function(x){return (x.nombre||'').toUpperCase()===(p.cliente||'').toUpperCase()});
    if(c){
      var sel=document.getElementById('sfCliSel');if(sel)sel.value=c.id;
      document.getElementById('sfRuc').value=c.ruc||c.documento||'';
      document.getElementById('sfDir').value=c.direccion||'';
      document.getElementById('sfTel').value=c.telefono||'';
    }
  }
}
function onSfCli(){
  var sel=document.getElementById('sfCliSel');
  var c=CLIS.find(function(x){return x.id===sel.value});
  if(c){
    document.getElementById('sfCliente').value=c.nombre||'';
    document.getElementById('sfRuc').value=c.ruc||c.documento||'';
    document.getElementById('sfDir').value=c.direccion||'';
    document.getElementById('sfTel').value=c.telefono||'';
  }else{
    ['sfCliente','sfRuc','sfDir','sfTel'].forEach(function(id){document.getElementById(id).value=''});
  }
  revisarCliNuevo();
}
function revisarCliNuevo(){
  var w=document.getElementById('sfGuardarCliWrap');if(!w)return;
  var n=document.getElementById('sfCliente').value.trim();
  var r=document.getElementById('sfRuc').value.trim();
  var c=n?buscarCli(n,r):null;
  w.style.display=n&&!c?'':'none';
  var sel=document.getElementById('sfCliSel');
  if(sel&&c&&sel.value!==c.id){
    sel.value=c.id;
    [['sfRuc',c.ruc||c.documento],['sfDir',c.direccion],['sfTel',c.telefono]].forEach(function(x){var el=document.getElementById(x[0]);if(el&&!el.value.trim()&&x[1])el.value=x[1]});
  }
  if(sel&&!c&&sel.value)sel.value='';
}
function abrirNuevoCli(){
  var d=document.getElementById('ncDepto');
  if(d.options.length<2)DEPTOS.forEach(function(x){var o=document.createElement('option');o.textContent=x;d.appendChild(o)});
  var sel=document.getElementById('sfCliSel');
  var escrito=sel&&!sel.value;
  document.getElementById('ncNombre').value=escrito?(document.getElementById('sfCliente').value||''):'';
  document.getElementById('ncRuc').value=escrito?(document.getElementById('sfRuc').value||''):'';
  document.getElementById('ncTel').value=escrito?(document.getElementById('sfTel').value||''):'';
  document.getElementById('ncDir').value=escrito?(document.getElementById('sfDir').value||''):'';
  document.getElementById('ncLocal').value='';document.getElementById('ncContacto').value='';d.selectedIndex=0;
  dupNuevoCli();
  document.getElementById('cliModal').classList.add('show');
  setTimeout(function(){document.getElementById('ncNombre').focus()},50);
}
function cerrarNuevoCli(){document.getElementById('cliModal').classList.remove('show')}
function dupNuevoCli(){
  var c=buscarCli(document.getElementById('ncNombre').value,document.getElementById('ncRuc').value);
  document.getElementById('ncDup').innerHTML=c?'<div class="cm-dup">Ya existe <strong>'+escH(c.nombre)+'</strong>'+(c.ruc?' (RUC '+escH(c.ruc)+')':'')+'. <a href="#" onclick="usarCliExistente(\''+escH(c.id)+'\');return false" style="color:inherit;font-weight:700">Usar ese</a></div>':'';
  return c;
}
function usarCliExistente(id){
  cerrarNuevoCli();
  var sel=document.getElementById('sfCliSel');if(sel){sel.value=id;onSfCli();}
}
function datosCliente(o){
  return {nombre:(o.nombre||'').trim().toUpperCase(),ruc:(o.ruc||'').trim(),telefono:(o.telefono||'').trim(),direccion:(o.direccion||'').trim(),
    departamento:o.departamento||'',localidad:(o.localidad||'').trim().toUpperCase(),contacto:(o.contacto||'').trim(),fechaAlta:new Date()};
}
function guardarNuevoCli(){
  var nombre=document.getElementById('ncNombre').value.trim();
  if(!nombre){toast('❌ El nombre es obligatorio');document.getElementById('ncNombre').focus();return;}
  var dup=dupNuevoCli();
  if(dup&&!confirm('Ya existe «'+dup.nombre+'». ¿Crear otro cliente igual?'))return;
  var data=datosCliente({nombre:nombre,ruc:document.getElementById('ncRuc').value,telefono:document.getElementById('ncTel').value,direccion:document.getElementById('ncDir').value,
    departamento:document.getElementById('ncDepto').value,localidad:document.getElementById('ncLocal').value,contacto:document.getElementById('ncContacto').value});
  var b=document.getElementById('ncGuardar');b.disabled=true;
  db.collection('clientes').add(data).then(function(ref){
    b.disabled=false;
    CLIS.push(Object.assign({id:ref.id},data));
    CLIS.sort(function(a,c){return (a.nombre||'').localeCompare(c.nombre||'')});
    var sel=document.getElementById('sfCliSel');
    if(sel){
      sel.innerHTML='<option value="">— Seleccionar o escribir abajo —</option>'+CLIS.map(function(c){return '<option value="'+escH(c.id)+'">'+escH(c.nombre)+(c.ruc?' · '+escH(c.ruc):'')+'</option>'}).join('');
      sel.value=ref.id;onSfCli();
    }
    cerrarNuevoCli();
    toast('✅ Cliente agregado a la lista');
  }).catch(function(e){b.disabled=false;toast('❌ '+e.message)});
}

function onSfSvc(sel){
  var s=SVCS.find(function(x){return x.c===sel.value});
  if(s){var tr=sel.closest('tr');tr.querySelectorAll('input')[1].value=s.n;}
  recalcSide();
}

function addSfItem(){
  var tb=document.getElementById('sfItems');var tr=document.createElement('tr');
  var opts='<option value="">—</option>';SVCS.forEach(function(s){opts+='<option value="'+s.c+'">'+s.c+'</option>'});
  tr.innerHTML='<td><input type="number" value="1" style="width:35px" oninput="recalcSide()"></td><td><select style="width:65px" onchange="onSfSvc(this)">'+opts+'</select></td><td><input style="width:100%" oninput="recalcSide()"></td><td><input type="number" value="0" style="width:80px" oninput="recalcSide()"></td><td><button class="rm" onclick="this.closest(\'tr\').remove();recalcSide()">×</button></td>';
  tb.appendChild(tr);
}

function getSfItems(){
  return Array.from(document.querySelectorAll('#sfItems tr')).map(function(r){
    var inp=r.querySelectorAll('input');var sel=r.querySelector('select');
    return{cant:parseInt(inp[0].value)||1,code:sel?sel.value:'',desc:inp[1].value,unit:parseFloat(inp[2].value)||0};
  });
}

function recalcSide(){
  var items=getSfItems();
  var total=items.reduce(function(s,i){return s+i.cant*i.unit},0);
  var iva=parseInt(document.getElementById('sfIva').value);if(isNaN(iva))iva=10;
  var ivaAmt=iva===10?total/11:(iva===5?total/21:0);
  var isU=(document.getElementById('sfMoneda').value||'').includes('DOLAR');
  var mon=isU?'USD':'Gs';
  var el=document.getElementById('sfTotals');
  if(el)el.innerHTML='<div class="sr"><span>Subtotal:</span><strong>'+mon+' '+(isU?fmtUsd(total):fmtGs(total))+'</strong></div><div class="sr"><span>IVA ('+iva+'%):</span><strong>'+mon+' '+(isU?fmtUsd(ivaAmt):fmtGs(ivaAmt))+'</strong></div><div class="sr tot"><span>Total:</span><span>'+mon+' '+(isU?fmtUsd(total):fmtGs(total))+'</span></div>';
}

/* ═══ Save ═══ */
function saveFactura(){
  var items=getSfItems();
  var total=items.reduce(function(s,i){return s+i.cant*i.unit},0);
  var iva=parseInt(document.getElementById('sfIva').value);if(isNaN(iva))iva=10;
  var data={
    fecha:document.getElementById('sfFecha').value,
    condicion:document.getElementById('sfCond').value,
    moneda:document.getElementById('sfMoneda').value,
    tipoIva:iva,
    cliente:document.getElementById('sfCliente').value,
    ruc:document.getElementById('sfRuc').value,
    direccion:document.getElementById('sfDir').value,
    telefono:document.getElementById('sfTel').value,
    items:items,
    total:total,
    ivaAmount:iva===10?total/11:(iva===5?total/21:0),
    servicio:items[0]?items[0].desc:'',
    codigoServicio:items[0]?items[0].code:'',
  };
  // Si el nombre escrito coincide con un cliente de la lista, la factura sale con el nombre oficial
  var selCli=document.getElementById('sfCliSel');
  var oficial=selCli&&selCli.value?CLIS.find(function(c){return c.id===selCli.value}):null;
  if(oficial&&normCli(oficial.nombre)===normCli(data.cliente))data.cliente=oficial.nombre;
  var pid=(document.getElementById('sfProy')||{}).value||'';
  data.proyectoId=pid||null;
  data.proyectoNombre=pid?(proyNombre(pid)||curF.proyectoNombre||'').toUpperCase():null;
  if(isNew){
    var chk=document.getElementById('sfGuardarCli'),wrap=document.getElementById('sfGuardarCliWrap');
    if(chk&&chk.checked&&wrap&&wrap.style.display!=='none'&&data.cliente.trim()&&!buscarCli(data.cliente,data.ruc)){
      var nc=datosCliente({nombre:data.cliente,ruc:data.ruc,telefono:data.telefono,direccion:data.direccion});
      db.collection('clientes').add(nc).then(function(ref){CLIS.push(Object.assign({id:ref.id},nc));toast('✅ Cliente guardado en la lista')}).catch(function(e){toast('❌ No se pudo guardar el cliente: '+e.message)});
    }
    var maxNum=ALL.reduce(function(m,f){return Math.max(m,f.numero||0)},270);
    var num=maxNum+1;
    data.numero=num;
    data.nroFormateado='001-001-'+String(num).padStart(7,'0');
    data.estado='activa';
    data.impresa=false;data.enviada=false;data.pagada=false;
    data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
    db.collection('facturas').add(data).then(function(){toast('✅ Factura #'+num+' creada');closePanel();loadAll()}).catch(function(e){toast('❌ '+e.message)});
  }else{
    var antes=curF,pasos=Promise.resolve();
    if(antes.pagoRecibidoId&&antes.proyectoId!==data.proyectoId){
      if(!data.proyectoId){
        if(!confirm('La factura está pagada y la estás quitando del proyecto.\nSu cobro se va a quitar del balance de ese proyecto. ¿Continuar?'))return;
        pasos=quitarCobroDe(antes).then(function(){data.pagoRecibidoId=null});
      }else{
        pasos=db.collection('pagos_recibidos').doc(antes.pagoRecibidoId).update({proyectoId:data.proyectoId,proyectoNombre:data.proyectoNombre});
      }
    }
    pasos.then(function(){return db.collection('facturas').doc(curId).update(data)}).then(function(){
      toast('✅ Factura actualizada');closePanel();loadAll();
      if(!antes.pagoRecibidoId&&antes.pagada&&data.proyectoId)setTimeout(function(){toast('Esta factura está pagada: abrila y tocá «Registrar cobro» para sumarla al balance')},3600);
    }).catch(function(e){toast('❌ '+e.message)});
  }
}

function anularFactura(){
  if(!confirm('¿Anular factura '+(curF.nroFormateado||'')+'?'+(curF.pagoRecibidoId?'\nSu cobro también se quita del balance del proyecto.':'')))return;
  var fa=curF;
  quitarCobroDe(fa).then(function(){return db.collection('facturas').doc(curId).update({estado:'anulada',pagoRecibidoId:null})}).then(function(){toast('✅ Factura anulada');closePanel();loadAll()}).catch(function(e){toast('❌ '+e.message)});
}

/* ═══ Status toggles ═══ */
function mkBadge(field,label,cls){
  if(curF[field])return'<span class="badge '+cls+'" style="font-size:10px;padding:3px 8px;cursor:pointer" title="Tocar para desmarcar" onclick="desmarcar(\''+field+'\')">'+label+' ✓</span> ';
  return'<span class="badge bw" style="font-size:10px;padding:3px 8px;cursor:pointer" title="Tocar para marcar" onclick="markAs(\''+field+'\')">'+label+'</span> ';
}
/* Destildar: impresa y enviada se quitan directo; pagada además quita el cobro del balance */
function desmarcar(field){
  if(!curId||!curF)return;
  if(field==='pagada'){desmarcarPagada();return;}
  var u={};u[field]=false;
  var id=curId;
  db.collection('facturas').doc(id).update(u).then(function(){
    toast('Marca quitada');loadAll();setTimeout(function(){openDetail(id)},400);
  }).catch(function(e){toast('❌ '+e.message)});
}
function markAs(field){
  if(!curId)return;
  if(field==='pagada'&&curF.proyectoId){abrirCobro();return;}
  var u={};u[field]=true;
  if(field==='pagada')u.fechaPago=new Date().toISOString().split('T')[0];
  db.collection('facturas').doc(curId).update(u).then(function(){toast('✅ Marcada');loadAll();setTimeout(function(){openDetail(curId)},400)}).catch(function(e){toast('❌ '+e.message)});
}

/* ═══ Cobros: una factura de proyecto suma al balance recién cuando se marca pagada ═══ */
var cobroCtx=null;
function numv(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?null:v}
function abrirCobro(){
  var f=curF;if(!f||!curId)return;
  var p=PROYS.find(function(x){return x.id===f.proyectoId})||{};
  var isU=(f.moneda||'').indexOf('DOLAR')>=0;
  cobroCtx={f:f,id:curId,p:p,isU:isU,previo:null};
  document.getElementById('cbSub').textContent='Factura '+(f.nroFormateado||'')+' · '+(p.nombre||f.proyectoNombre||'')+' · '+(isU?'USD ':'Gs ')+(isU?fmtUsd(f.total||0):fmtGs(f.total||0));
  document.getElementById('cbFecha').value=new Date().toISOString().split('T')[0];
  document.getElementById('cbMonto').value=f.total||0;
  document.getElementById('cbMontoL').textContent='Monto cobrado ('+(isU?'USD':'Gs')+', antes de retención)';
  var ret=p.descuentoIva!=null?p.descuentoIva:0.07;
  document.getElementById('cbRet').value=Math.round(ret*1000)/10;
  document.getElementById('cbCot').value=p.cotizacion||'';
  document.getElementById('cbNota').innerHTML='';
  document.getElementById('cobroModal').classList.add('show');
  calcCobro();
  // ¿Hay un cobro de anticipo viejo (creado al aprobar) sin factura vinculada? Se reutiliza para no duplicar.
  if(f.tipo==='anticipo'){
    db.collection('pagos_recibidos').where('proyectoId','==',f.proyectoId).get().then(function(s){
      var viejo=s.docs.map(function(d){return Object.assign({_id:d.id},d.data())}).find(function(x){
        return x.proyectoId===f.proyectoId&&!x.facturaId&&/^anticipo/i.test(x.concepto||'');
      });
      if(!viejo||!cobroCtx||cobroCtx.f!==f)return;
      cobroCtx.previo=viejo;
      if(viejo.cotizacion)document.getElementById('cbCot').value=viejo.cotizacion;
      document.getElementById('cbNota').innerHTML='<div class="cm-dup">Ya hay un cobro «'+escH(viejo.concepto)+'» registrado al aprobar el proyecto. Se va a actualizar con estos datos (no se duplica).</div>';
      calcCobro();
    }).catch(function(){});
  }
}
function cerrarCobro(){document.getElementById('cobroModal').classList.remove('show');cobroCtx=null}
function datosCobro(){
  var c=cobroCtx;if(!c)return null;
  var monto=numv('cbMonto'),ret=(numv('cbRet')||0)/100,cot=numv('cbCot');
  if(!(monto>0))return {error:'Ingresá el monto cobrado'};
  if(!(cot>0))return {error:'Ingresá la cotización del día del cobro'};
  if(ret<0||ret>=1)return {error:'La retención tiene que estar entre 0 y 100%'};
  var usd=c.isU?monto:monto/cot;
  var finalUsd=usd-usd*ret;
  var finalGs=c.isU?finalUsd*cot:monto-monto*ret;
  return {usd:usd,ret:ret,cot:cot,finalUsd:finalUsd,finalGs:finalGs};
}
function calcCobro(){
  var d=datosCobro(),el=document.getElementById('cbPrev');
  if(!d||d.error){el.innerHTML='<span style="color:var(--tx2)">'+escH(d?d.error:'')+'</span>';return}
  el.innerHTML='<div class="sr"><span>Neto cobrado USD</span><strong>USD '+fmtUsd(d.finalUsd)+'</strong></div><div class="sr"><span>Neto cobrado Gs</span><strong>₲ '+fmtGs(Math.round(d.finalGs))+'</strong></div><div style="font-size:10px;color:var(--tx3);margin-top:4px">Esto es lo que suma como «Cobrado» en el balance del proyecto.</div>';
}
function guardarCobro(){
  var c=cobroCtx,d=datosCobro();
  if(!c||!d)return;
  if(d.error){toast('❌ '+d.error);return}
  var f=c.f,fecha=document.getElementById('cbFecha').value||new Date().toISOString().split('T')[0];
  var desc=f.items&&f.items[0]?f.items[0].desc:(f.servicio||'');
  var pago={
    proyectoId:f.proyectoId,proyectoNombre:(c.p.nombre||f.proyectoNombre||'').toUpperCase(),
    concepto:(f.tipo==='anticipo'?'Anticipo':'Factura')+' '+(f.nroFormateado||'')+(desc&&f.tipo!=='anticipo'?' — '+desc.slice(0,60):''),
    montoUsd:d.usd,retencion:d.ret,montoFinalUsd:d.finalUsd,cotizacion:d.cot,montoFinalGs:d.finalGs,
    fecha:new Date(fecha+'T12:00:00'),facturaId:c.id
  };
  var b=document.getElementById('cbGuardar');b.disabled=true;
  var existente=f.pagoRecibidoId||(c.previo&&c.previo._id);
  var op=existente?db.collection('pagos_recibidos').doc(existente).set(pago).then(function(){return existente})
                  :db.collection('pagos_recibidos').add(pago).then(function(r){return r.id});
  op.then(function(pid){
    return db.collection('facturas').doc(c.id).update({pagada:true,fechaPago:fecha,pagoRecibidoId:pid});
  }).then(function(){
    b.disabled=false;cerrarCobro();toast('💰 Cobro registrado en el balance');
    var id=curId;loadAll();setTimeout(function(){openDetail(id)},400);
  }).catch(function(e){b.disabled=false;toast('❌ '+e.message)});
}
function quitarCobroDe(f){
  return f.pagoRecibidoId?db.collection('pagos_recibidos').doc(f.pagoRecibidoId).delete():Promise.resolve();
}
function desmarcarPagada(){
  var f=curF;if(!f||!curId)return;
  if(!confirm('¿Desmarcar la factura '+(f.nroFormateado||'')+' como pagada?'+(f.pagoRecibidoId?'\nEl cobro se quita del balance del proyecto.':'')))return;
  var id=curId;
  quitarCobroDe(f).then(function(){
    return db.collection('facturas').doc(id).update({pagada:false,fechaPago:null,pagoRecibidoId:null});
  }).then(function(){toast('Factura marcada como no pagada');loadAll();setTimeout(function(){openDetail(id)},400)}).catch(function(e){toast('❌ '+e.message)});
}

/* ═══ Print ═══ */
function printFactura(){
  if(!curF)return;
  var pp=armarHoja(curF);
  pp.style.display='block';
  setTimeout(function(){window.print();pp.style.display='none'},250);
}

/* ═══ Panel ═══ */
function openPanel(){document.getElementById('sideBg').classList.add('show');document.getElementById('sidePanel').classList.add('show')}
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;var m=document.getElementById('cliModal');if(m&&m.classList.contains('show')){cerrarNuevoCli();return}closePanel()});
function closePanel(){document.getElementById('sideBg').classList.remove('show');document.getElementById('sidePanel').classList.remove('show')}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},3000)}
</script>
